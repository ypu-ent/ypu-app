<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<title>Y-PU プロジェクト</title>
<script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface2:#ECECE6; --line:#DCDBD3; --fg:#1D2125; --muted:#5B6066;
  --gold:#E3A50B; --gold-ink:#7A5200; --gold-soft:#FFF1CC; --ink:#22272C; --on-ink:#FFFFFF;
  --ok:#17704A; --ok-soft:#E1F3E9; --warn:#8A5300; --warn-soft:#FFEFC9; --bad:#AE3410; --bad-soft:#FBE3D8;
  --info:#1F5FA8; --info-soft:#E2EDFA; --mute-soft:#E9E9E3;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{margin:0}
.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}
.app{max-width:1320px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.app.m{max-width:460px;border-inline:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.app.m .top{padding:10px 12px}
.ttl{display:flex;align-items:center;gap:8px;min-width:0}
.ttl small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ttl h1{font-size:19px}
.app.m .ttl h1{font-size:16px}
.iconbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.right{display:flex;align-items:center;gap:8px}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.content{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.app.m .content{padding:14px;gap:12px}
.foot{padding:10px 20px;font-size:11px;color:var(--muted);text-align:right}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.app.m .g2,.app.m .g3{grid-template-columns:minmax(0,1fr)}
.app.m .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.app.m .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:16px}
.panel h3{font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.app.m .stat{padding:8px 10px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat b{font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.app.m .stat b{font-size:20px}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--ink)}
button.stat.on{box-shadow:inset 0 0 0 2px var(--ink)}
.stat.bad{background:var(--bad-soft);border-color:transparent}.stat.bad span,.stat.bad b{color:var(--bad)}
.stat.gold{background:var(--gold-soft);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#1D2125;border-color:var(--gold)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:12px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:wait}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;border:none}
button.pill{cursor:pointer;min-height:28px}
.p-gray{background:var(--mute-soft);color:var(--muted)}.p-info{background:var(--info-soft);color:var(--info)}.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
select.pill{border:none;padding-right:4px;cursor:pointer;min-height:28px}
.name{display:inline-flex;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:1px 8px;white-space:nowrap}
.pjcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;cursor:pointer;width:100%}
.pjcard:hover{border-color:var(--gold)}
.pjcard .nm{font-size:18px;font-weight:700}
.pjcard .days{font-size:28px;font-weight:700;line-height:1}
.tile{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;text-align:center;padding:6px}
.tile.x{color:var(--muted);border-style:dashed;cursor:default}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:140px;display:flex;flex-direction:column}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.grp td{background:var(--gold-soft);font-weight:700;padding:8px 10px}
.t tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.t tr.done td{color:var(--muted)}
.t tr.now td{background:var(--gold-soft)}
.t th{position:relative}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.rz::after{content:"";position:absolute;top:20%;bottom:20%;left:4px;width:2px;border-radius:1px;background:transparent}
.t th:hover .rz::after{background:#B9B8AF}
.rz:hover::after,.rz.on::after{background:var(--info)!important;top:0;bottom:0}
table.t.fixed{table-layout:fixed}
.t.fixed th{overflow:hidden;text-overflow:ellipsis}
.t.fixed td{overflow:hidden;overflow-wrap:anywhere}
.t.fixed .cell{min-width:0!important;width:100%!important}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.cell{width:100%;min-width:56px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--info);background:var(--surface);outline:none}
.box{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:400;font-size:14px;color:var(--fg);min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.mine{border-color:var(--gold)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grphead{font-size:12px;font-weight:700;color:var(--gold-ink);display:flex;justify-content:space-between;align-items:center;padding:6px 2px 0}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.callout{border:1px dashed var(--gold-ink);background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7}
.check{min-width:64px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.check.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.login{max-width:400px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:22px}
.login input{font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.login .btn{min-height:48px;font-size:15px}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.loading{opacity:.6;pointer-events:none}
.hbar{display:grid;grid-template-columns:minmax(70px,170px) minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold)}
.hbar .n{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.kwmap{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;line-height:1.3}
.kw{border:none;background:none;cursor:pointer;font-weight:700;padding:2px 4px;border-radius:6px}
.kw.pos{color:var(--ok)}.kw.neg{color:var(--bad)}.kw.sel{background:var(--gold-soft)}
.quote{font-size:13px;padding:8px 12px;border-left:3px solid var(--line);background:var(--surface2);border-radius:0 8px 8px 0}
.tt-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.app.m .tt-layout{grid-template-columns:minmax(0,1fr)}
.tt-preview{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#E9E8E2;padding:14px;max-height:calc(100vh - 160px)}
.tt-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 160px);overflow:auto}
.app.m .tt-preview,.app.m .tt-side{max-height:none}
.blk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.blk.sel{border-color:var(--info);box-shadow:0 0 0 2px var(--info-soft)}
.blk textarea{grid-column:1/-1;min-height:38px;resize:vertical}
.blk input,.blk select,.blk textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:var(--surface);min-width:0}
.blk label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.mini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px auto;gap:6px;align-items:center}
.mini input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;min-width:0}
.flowt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px}
</style>
</head>
<body>
<div id="cfg" hidden></div>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
"use strict";
/* ほかのサーバー（GitHub Pagesなど）にこのファイルを置くときだけ、下の '' の中に
   ウェブアプリのURL（https://script.google.com/macros/s/…/exec）を貼ってください */
var API_URL_HOSTED = window.YPU_API || '';

var PAGES = ['ホーム','ToDo','集客アタック','メンバー表','アンケート分析','備品表','制作物・図面','資料','タイムテーブル','権限・連携'];
var PAGE_VIEW = {'ToDo':'todo','集客アタック':'attack','メンバー表':'members','アンケート分析':'analysis','備品表':'equip','制作物・図面':'works','資料':'docs','タイムテーブル':'timetable','権限・連携':'settings'};
var VIEW_TITLE = {home:'ホーム',todo:'ToDo',attack:'集客アタック',members:'メンバー表',analysis:'アンケート分析',equip:'備品表',works:'制作物・図面',docs:'資料',timetable:'タイムテーブル',settings:'権限・連携'};
var PARTS = {home:['todo','atk'],todo:['todo'],attack:['atk'],members:['guest','staff','share'],equip:['equip'],works:['work'],docs:['doc'],timetable:['ttcfg','block','flow']};
var POLL_MS = 30000;
var CFG = document.getElementById('cfg');
var cfgApi = CFG ? (CFG.getAttribute('data-api') || '') : '';
var API = /^https:\/\//.test(cfgApi) ? cfgApi : API_URL_HOSTED;
var cfgGuest = CFG ? (CFG.getAttribute('data-guest') || '') : '';
var GUEST = /^[0-9a-zA-Z]{8,}$/.test(cfgGuest) ? cfgGuest : ((location.search.match(/[?&]guest=([0-9a-zA-Z]+)/) || [])[1] || '');

/* ========== 小道具 ========== */
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function store(k, v){ try { if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e){} }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ if(!r.ok) throw new Error('通信エラー（' + r.status + '）。少し待ってからもう一度お試しください。'); return r.text(); })
    .then(function(text){
      var j; try { j = JSON.parse(text); } catch(e){ throw new Error('サイトの公開設定を確認してください（アクセスできるユーザー：全員）。'); }
      if(!j.ok) throw new Error(j.error); return j.result;
    });
}
var toastT;
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3200); }
function md(s){ var m = String(s||'').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? m[1] + '/' + m[2] : '-'; }
function todayStr(){ return (S.data && S.data.today) || (S.guest && S.guest.today) || new Date().toISOString().slice(0,10); }
function daysLeft(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null;
  var t = todayStr().split('-').map(Number);
  return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(t[0], t[1]-1, t[2])) / 86400000);
}
function addDays(n){ var t = todayStr().split('-').map(Number); return new Date(Date.UTC(t[0], t[1]-1, t[2] + n)).toISOString().slice(0,10); }
function toMin(t){ var m = String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : 0; }
function fromMin(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function whoIncludes(who, name){ return String(who||'').split(/[,、\s]+/).some(function(x){ return x === name || x === 'ALL'; }); }
function names(who){ return String(who||'').split(/[,、]+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(n){ return '<span class="name">' + esc(n) + '</span>'; }).join(' '); }
function yen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
var PILL = {
  todo:{'未着手':'p-gray','進行中':'p-info','完了':'p-ok'},
  atk:{'未連絡':'p-gray','連絡済':'p-info','返信あり':'p-warn','参加確定':'p-ok','NG':'p-bad'},
  guest:{'申込':'p-info','参加':'p-ok','欠席':'p-gray','キャンセル':'p-bad'},
  equip:{'未手配':'p-bad','手配済':'p-warn','確保済':'p-info','搬入済':'p-ok','返却済':'p-gray'},
  work:{'未着手':'p-gray','ラフ':'p-info','確認中':'p-warn','修正':'p-bad','OK':'p-ok','入稿済':'p-ok'},
  doc:{'未着手':'p-gray','作成中':'p-info','確認待ち':'p-warn','確定':'p-ok'}
};
function pill(kind, s){ return (PILL[kind] && PILL[kind][s]) || 'p-gray'; }
function leftPill(status, end, doneWords){
  if((doneWords || ['完了']).indexOf(status) >= 0) return '<span class="sub">—</span>';
  var n = daysLeft(end); if(n === null) return '<span class="sub">-</span>';
  if(n < 0) return '<span class="pill p-bad tab">' + (-n) + '日超過</span>';
  if(n === 0) return '<span class="pill p-warn">今日</span>';
  if(n <= 3) return '<span class="pill p-warn tab">あと' + n + '日</span>';
  return '<span class="tab">' + n + '</span>';
}
function opts(list, cur, blank){
  var l = list.slice(); if(cur && l.indexOf(cur) < 0) l.push(cur);
  return (blank ? '<option value=""></option>' : '') + l.map(function(v){ return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
}
var ICON_BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
/* 表の1マス：data-t（表）・data-f（項目）・data-id（行）で保存先を決める */
function inp(t, id, f, val, attrs){ return '<input class="cell' + ((attrs && attrs.cls) || '') + '" value="' + esc(val) + '" data-t="' + t + '" data-f="' + f + '" data-id="' + esc(id) + '"' + ((attrs && attrs.extra) || '') + '>'; }
function sel(t, id, f, list, val, cls, blank){ return '<select class="cell ' + (cls||'') + '" data-t="' + t + '" data-f="' + f + '" data-id="' + esc(id) + '" aria-label="' + esc(f) + '">' + opts(list, val, blank) + '</select>'; }
function delBtn(t, id){ return S.confirmDel === t + id ? '<button class="btn sm danger" data-act="del" data-k="' + t + '" data-v="' + esc(id) + '">本当に削除</button>' : '<button class="btn sm" data-act="delAsk" data-k="' + t + '" data-v="' + esc(id) + '">削除</button>'; }
function statBtns(kind, list, rows, field, fkey){
  return list.map(function(s){
    var n = rows.filter(function(r){ return r[field] === s; }).length, on = S.filter[fkey] === s;
    return '<button class="stat' + (on ? ' on' : '') + (kind === 'equip' && s === '未手配' && n ? ' bad' : '') + '" data-act="filt" data-k="' + fkey + '" data-v="' + esc(s) + '" aria-pressed="' + on + '"><span>' + esc(s) + '</span><b>' + n + '</b></button>';
  }).join('');
}
function filterNote(fkey){
  var v = S.filter[fkey];
  return v ? '<div class="row"><span class="pill p-gold">「' + esc(v) + '」だけ表示中</span><button class="btn sm" data-act="filt" data-k="' + fkey + '" data-v="' + esc(v) + '">絞り込みを解除</button></div>'
           : '<p class="sub" style="margin:0">上の四角を押すと、その状態の一覧だけを表示します。</p>';
}
function download(name, blob){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ========== 状態 ========== */
var S = {
  token: load('ypu_token'), view: 'login', step: 'email', email: load('ypu_email'), msg: '', msgOk: false,
  boot: null, pjId: '', data: null, busy: false, layout: load('ypu_layout') || 'auto', confirmDel: '', lastAt: '',
  todoMine: false, todoStatus: '未完了', atkKind: '学生', atkMine: false, dup: null,
  filter: {}, search: {}, memTab: 'guest', equipMode: 'prep', ttTab: 'detail', sel: '', flowAt: '', ttDraft: null,
  forms: null, kw: '', admin: null, guest: null, colW: loadColW()
};
function isM(){ return S.layout === 'sp' || (S.layout === 'auto' && window.innerWidth < 760); }
function can(page){ return S.data && S.data.pages.indexOf(page) >= 0; }
function choices(k){ return (S.data && S.data.choices && S.data.choices[k]) || []; }
function P(k){ return (S.data && S.data.parts && S.data.parts[k]) || []; }

function fail(err){
  var m = (err && err.message) || String(err);
  S.busy = false;
  if(m.indexOf('LOGIN') >= 0){ store('ypu_token', ''); S.token = ''; S.view = 'login'; S.step = 'email'; S.msg = 'もう一度ログインしてください。'; S.msgOk = false; render(); return; }
  toast(m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''));
  render();
}

/* ========== 読み込み ========== */
function merge(d){
  var old = (S.data && S.data.project && S.data.project.id === d.project.id) ? (S.data.parts || {}) : {};
  var parts = Object.assign({}, old, d.parts || {});
  S.data = Object.assign({}, d, { parts: parts });
  S.lastAt = d.at;
}
function loadBoot(){
  S.busy = true; render();
  return call('getBoot', S.token).then(function(b){ S.boot = b; S.lastAt = b.at; S.view = 'top'; S.busy = false; render(); }).catch(fail);
}
function openPj(id){
  S.busy = true; S.filter = {}; S.search = {}; S.ttDraft = null; S.forms = null; S.admin = null; render();
  return call('getProject', S.token, id, PARTS.home).then(function(d){ S.pjId = id; S.data = null; merge(d); S.view = 'home'; S.busy = false; render(); window.scrollTo(0,0); }).catch(fail);
}
function loadView(v){
  S.view = v; S.dup = null; S.confirmDel = ''; window.scrollTo(0,0);
  if(v === 'analysis'){ render(); if(!S.forms) loadForms(); return; }
  if(v === 'settings'){ render(); loadAdmin(); return; }
  if(!PARTS[v]){ render(); return; }
  S.busy = true; render();
  call('getProject', S.token, S.pjId, PARTS[v]).then(function(d){ merge(d); S.busy = false; render(); }).catch(fail);
}
function strip(o){ if(!o) return o; var c = {}; for(var k in o){ if(k !== 'at') c[k] = o[k]; } return c; }
function editing(){ var ae = document.activeElement; return ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName); }
function poll(){
  if(document.hidden || S.busy || DRAG || editing()) return;
  if(GUEST){
    call('guestGet', GUEST).then(function(g){ if(editing()) return; var ch = JSON.stringify(strip(g)) !== JSON.stringify(strip(S.guest)); S.guest = g; if(ch) render(); }).catch(function(){});
    return;
  }
  if(!S.token || S.view === 'login') return;
  if(S.view === 'top'){
    call('getBoot', S.token).then(function(b){ var ch = JSON.stringify(strip(b)) !== JSON.stringify(strip(S.boot)); S.boot = b; S.lastAt = b.at; if(ch) render(); else setFoot(); }).catch(function(){});
  } else if(S.pjId && PARTS[S.view]){
    var keys = PARTS[S.view];
    call('getProject', S.token, S.pjId, keys).then(function(d){
      if(editing() || S.busy) return;
      var before = JSON.stringify(keys.map(function(k){ return S.data.parts[k]; }));
      var after = JSON.stringify(keys.map(function(k){ return d.parts[k]; }));
      merge(d); if(before !== after){ render(); toast('最新の内容に更新しました'); } else setFoot();
    }).catch(function(){});
  }
}
setInterval(poll, POLL_MS);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
window.addEventListener('resize', function(){ if(S.layout === 'auto') render(); });

/* ========== 共通の枠 ========== */
function header(){
  var back = '', small = 'Y-PU', title = 'プロジェクト';
  if(S.view !== 'top' && S.data){ small = S.data.project.name; title = VIEW_TITLE[S.view] || ''; back = S.view === 'home' ? 'top' : 'home'; }
  var me = (S.data && S.data.me) || (S.boot && S.boot.me) || {};
  var seg = '<div class="seg" role="group" aria-label="レイアウト">' + [['auto','自動'],['pc','PC'],['sp','スマホ']].map(function(x){ return '<button class="' + (S.layout===x[0]?'on':'') + '" data-act="layout" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  return '<header class="top"><div class="ttl">' +
    (back ? '<button class="iconbtn" data-act="go" data-v="' + back + '" aria-label="戻る">' + ICON_BACK + '</button>' : '') +
    '<div style="min-width:0"><small>' + esc(small) + '</small><h1>' + esc(title) + '</h1></div></div>' +
    '<div class="right">' + (isM() ? '' : seg) + '<span class="who">' + esc(me.name || '') + 'さん</span><button class="btn sm" data-act="logout">ログアウト</button></div></header>';
}
function footer(){ return '<div class="foot" id="foot">' + footText() + '</div>'; }
function footText(){ return (S.lastAt ? '最終更新 ' + esc(S.lastAt) + '　・　' : '') + '30秒ごとに自動で最新にします' + (isM() ? '　・　<button class="btn sm" data-act="layout" data-v="' + (S.layout === 'sp' ? 'auto' : 'sp') + '">' + (S.layout === 'sp' ? '自動レイアウトに戻す' : 'スマホ表示に固定') + '</button>' : ''); }
function setFoot(){ var f = document.getElementById('foot'); if(f) f.innerHTML = footText(); }
function page(body){ return header() + '<main class="content">' + body + '</main>' + footer(); }

/* ========== ログイン ========== */
function viewLogin(){
  var body;
  if(S.step === 'email'){
    body = '<form class="login" data-form="email"><h2>ログイン</h2>' +
      '<p class="sub" style="font-size:13px">登録したメールアドレスを入力してください。ログイン用の6桁のコードをメールで送ります。</p>' +
      (S.msg ? '<div class="msg' + (S.msgOk?' ok':'') + '">' + esc(S.msg) + '</div>' : '') +
      '<label class="sub" for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required value="' + esc(S.email) + '">' +
      '<button class="btn pri" type="submit"' + (S.busy?' disabled':'') + '>' + (S.busy ? '送っています…' : 'コードを送る') + '</button></form>';
  } else {
    body = '<form class="login" data-form="code"><h2>コードを入力</h2>' +
      '<p class="sub" style="font-size:13px">' + esc(S.email) + ' に届いた6桁のコードを入力してください（10分間有効）。届かないときは迷惑メールも確認してください。</p>' +
      (S.msg ? '<div class="msg' + (S.msgOk?' ok':'') + '">' + esc(S.msg) + '</div>' : '') +
      '<label class="sub" for="code">ログインコード</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>' +
      '<button class="btn pri" type="submit"' + (S.busy?' disabled':'') + '>' + (S.busy ? '確認しています…' : 'ログイン') + '</button>' +
      '<button class="btn" type="button" data-act="backEmail">メールアドレスを入れ直す</button></form>';
  }
  return '<main class="content">' + body + '</main>';
}

/* ========== TOP ========== */
function pjCard(p){
  var s = p.summary, pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  return '<button class="pjcard" data-act="openPj" data-v="' + esc(p.id) + '">' +
    '<div class="cardhead"><span class="sub">' + esc(p.client) + (p.kind ? ' ・ ' + esc(p.kind) : '') + '</span>' + (p.role ? '<span class="pill p-gold">' + esc(p.role) + '</span>' : '') + '</div>' +
    '<div class="cardhead" style="align-items:flex-end"><span class="nm">' + esc(p.name) + '</span>' +
    (p.days !== null ? '<span style="text-align:right"><span class="sub">本番まで</span><br><span class="days tab">' + p.days + '</span><span class="sub"> 日</span></span>' : '') + '</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="row" style="gap:6px"><span class="pill ' + (s.myOpen ? 'p-info' : 'p-gray') + '">自分のToDo ' + s.myOpen + '</span>' +
    (s.myLate ? '<span class="pill p-bad">期限切れ ' + s.myLate + '</span>' : '') +
    (s.myAtk ? '<span class="pill p-warn">アタック ' + s.myAtk + '</span>' : '') +
    '<span class="sub tab">' + (p.date ? md(p.date) + ' 本番 ・ ' : '') + '全体 ' + pct + '%</span></div>' +
    (s.next ? '<span class="sub">次の締切：' + md(s.next.date) + ' ' + esc(s.next.title) + '</span>' : '') + '</button>';
}
function viewTop(){
  var b = S.boot;
  return header() + '<main class="content">' +
    '<div><h2 style="font-size:20px">' + esc(b.me.name) + 'さんのプロジェクト</h2><p class="sub">関わっているプロジェクトを本番が近い順に表示しています。押すとそのプロジェクトに入ります。</p></div>' +
    (b.mine.length ? '<div class="grid g2">' + b.mine.map(pjCard).join('') + '</div>' : '<div class="panel empty">参加中のプロジェクトはまだありません。管理者に「PJメンバー」シートへの登録を頼んでください。</div>') +
    (b.others.length ? '<h2 style="font-size:16px">そのほかのプロジェクト</h2><div class="grid g2">' + b.others.map(pjCard).join('') + '</div>' : '') +
    '</main>' + footer();
}

/* ========== ホーム ========== */
function myTodos(){ var me = S.data.me; return P('todo').filter(function(t){ return t.status !== '完了' && whoIncludes(t.who, me.name); }).sort(function(a,b){ return (a.end||'9999').localeCompare(b.end||'9999'); }); }
function myAttacks(){ var me = S.data.me; return P('atk').filter(function(a){ return a.who === me.name && a.status !== 'NG' && a.status !== '参加確定'; }).sort(function(a,b){ return (a.nextDate||'9999').localeCompare(b.nextDate||'9999'); }); }
function viewHome(){
  var d = S.data, p = d.project, canTodo = can('ToDo'), canAtk = can('集客アタック');
  var mine = canTodo ? myTodos() : [];
  var over = mine.filter(function(t){ var n = daysLeft(t.end); return n !== null && n < 0; }).length;
  var week = mine.filter(function(t){ var n = daysLeft(t.end); return n !== null && n >= 0 && n <= 7; }).length;
  var stats = '<div class="grid g4">' +
    (canTodo ? '<button class="stat' + (over?' bad':'') + '" data-act="todoFilter" data-v="期限切れ"><span>期限切れ</span><b>' + over + '</b></button>' +
               '<button class="stat" data-act="todoFilter" data-v="7日以内"><span>7日以内の締切</span><b>' + week + '</b></button>' : '') +
    '<div class="stat"><span>本番まで</span><b>' + (p.days !== null ? p.days + '<small style="font-size:13px"> 日</small>' : '-') + '</b></div>' +
    '<div class="stat gold"><span>あなたの役割</span><b style="font-size:18px">' + esc(p.role || '—') + '</b></div></div>';
  var tiles = '<div class="grid auto">' + PAGES.filter(function(x){ return x !== 'ホーム'; }).map(function(x){
    return can(x) ? '<button class="tile" data-act="page" data-v="' + esc(x) + '">' + esc(x) + '</button>' : '<span class="tile x">' + esc(x) + '（閲覧不可）</span>';
  }).join('') + '</div>';
  var todoPanel = !canTodo ? '' : '<div class="panel"><div class="row spread"><h2>' + esc(d.me.name) + 'さんのToDo</h2><button class="btn sm" data-act="page" data-v="ToDo">ToDoを開く</button></div>' +
    (mine.length ? '<div class="list">' + mine.slice(0, 8).map(function(t){
      return '<div class="li"><button class="pill ' + pill('todo', t.status) + '" data-act="cycle" data-v="' + esc(t.id) + '" title="押すとステータスを進める">' + esc(t.status) + '</button>' +
        '<div class="grow"><b>' + esc(t.sub || t.group) + '</b><span class="sub">' + esc(t.group) + (t.memo ? ' ・ ' + esc(t.memo) : '') + '</span></div>' +
        '<span class="sub tab">〆 ' + md(t.end) + '</span>' + leftPill(t.status, t.end) + '</div>';
    }).join('') + '</div>' : '<p class="sub">担当中のToDoはありません。</p>') + '</div>';
  var atkPanel = '';
  if(canAtk){
    var ma = myAttacks();
    atkPanel = '<div class="panel"><div class="row spread"><h2>' + esc(d.me.name) + 'さんの集客アタック</h2><button class="btn sm" data-act="page" data-v="集客アタック">一覧を開く</button></div>' +
      (ma.length ? '<div class="list">' + ma.slice(0, 8).map(function(a){
        return '<div class="li"><div class="grow"><b>' + esc(a.name) + '</b><span class="sub">' + esc(a.cat) + (a.via ? ' ・ ' + esc(a.via) : '') + (a.next ? ' ・ 次：' + esc(a.next) : '') + '</span></div>' +
          (a.nextDate ? '<span class="sub tab">' + md(a.nextDate) + '</span>' : '') +
          '<select class="pill ' + pill('atk', a.status) + '" data-t="atk" data-f="status" data-id="' + esc(a.id) + '" aria-label="ステータス">' + opts(choices('アタックステータス'), a.status) + '</select></div>';
      }).join('') + '</div>' : '<p class="sub">担当中のアタック先はありません。</p>') + '</div>';
  }
  var panels = d.me.staff ? todoPanel + atkPanel : atkPanel + todoPanel;
  return page(stats + tiles + '<div class="grid g2" style="align-items:start">' + panels + '</div>');
}

/* ========== ToDo ========== */
function stMatch(t){
  var f = S.todoStatus, n = daysLeft(t.end);
  if(f === 'すべて') return true;
  if(f === '未完了') return t.status !== '完了';
  if(f === '期限切れ') return t.status !== '完了' && n !== null && n < 0;
  if(f === '7日以内') return t.status !== '完了' && n !== null && n >= 0 && n <= 7;
  return t.status === f;
}
function viewTodo(){
  var me = S.data.me, order = [], map = {};
  P('todo').forEach(function(t){ var g = t.group || '（大見出しなし）'; if(!map[g]){ map[g] = []; order.push(g); } map[g].push(t); });
  var head = '<div class="row spread"><div class="row">' +
    '<div class="seg" role="group" aria-label="表示範囲"><button class="' + (!S.todoMine?'on':'') + '" data-act="todoMine" data-v="0">全員</button><button class="' + (S.todoMine?'on':'') + '" data-act="todoMine" data-v="1">自分の担当</button></div>' +
    '<div class="seg" role="group" aria-label="絞り込み">' + ['未完了','期限切れ','7日以内','未着手','進行中','完了','すべて'].map(function(s){ return '<button class="' + (S.todoStatus===s?'on':'') + '" data-act="todoStatus" data-v="' + s + '">' + s + '</button>'; }).join('') + '</div></div>' +
    '<form class="row" data-form="group"><label class="sr" for="newGroup">新しい大見出し</label><input id="newGroup" class="cell box" style="width:180px" placeholder="新しい大見出し"><button class="btn pri" type="submit">＋ 追加</button></form></div>';
  var gs = order.map(function(g){
    var rows = map[g].filter(function(t){ return (!S.todoMine || whoIncludes(t.who, me.name)) && stMatch(t); });
    return { name: g, all: map[g], rows: rows };
  }).filter(function(g){ return g.rows.length || (!S.todoMine && S.todoStatus === 'すべて'); });
  if(!gs.length) return page(head + '<div class="panel empty">条件に合うToDoはありません。</div>');
  var body;
  if(isM()){
    body = gs.map(function(g){
      return '<div class="grphead"><span>' + esc(g.name) + '</span><button class="btn sm" data-act="addRow" data-v="' + esc(g.name) + '">＋ 行</button></div>' + g.rows.map(function(t){
        return '<div class="card' + (whoIncludes(t.who, me.name) ? ' mine' : '') + '">' +
          '<div class="cardhead"><button class="pill ' + pill('todo', t.status) + '" data-act="cycle" data-v="' + esc(t.id) + '">' + esc(t.status) + '</button>' + leftPill(t.status, t.end) + '</div>' +
          inp('todo', t.id, 'sub', t.sub, { extra: ' style="font-weight:700;font-size:15px;padding-inline:0" placeholder="小見出し" aria-label="小見出し"' }) +
          inp('todo', t.id, 'memo', t.memo, { cls: ' sub', extra: ' style="padding-inline:0" placeholder="内容・進捗メモ" aria-label="内容・進捗メモ"' }) +
          '<div class="cardhead"><span>' + names(t.who) + '</span><label class="sub">〆 ' + inp('todo', t.id, 'end', t.end, { cls: ' tab', extra: ' type="date" style="width:auto;display:inline-block" aria-label="締切日"' }) + '</label></div>' +
          (t.fb ? '<span class="sub" style="color:var(--warn)">FB：' + esc(t.fb) + '</span>' : '') + '</div>';
      }).join('');
    }).join('');
  } else {
    body = '<div class="tblwrap"><table class="t" data-tbl="todo"><thead><tr><th>ステータス</th><th>小見出し</th><th>内容・進捗メモ</th><th>開始日</th><th>締切日</th><th>残日数</th><th>担当者</th><th>FBメモ</th><th></th></tr></thead><tbody>' +
      gs.map(function(g){
        var done = g.all.filter(function(t){ return t.status === '完了'; }).length;
        return '<tr class="grp"><td colspan="9"><div class="row spread"><span>' + esc(g.name) + '</span><span class="row"><span class="sub tab">' + done + '/' + g.all.length + ' 完了</span><button class="btn sm" data-act="addRow" data-v="' + esc(g.name) + '">＋ 行を追加</button></span></div></td></tr>' +
          g.rows.map(function(t){
            return '<tr class="' + (whoIncludes(t.who, me.name) ? 'mine ' : '') + (t.status === '完了' ? 'done' : '') + '">' +
              '<td>' + sel('todo', t.id, 'status', ['未着手','進行中','完了'], t.status) + '</td>' +
              '<td>' + inp('todo', t.id, 'sub', t.sub, { extra: ' style="min-width:150px" aria-label="小見出し"' }) + '</td>' +
              '<td>' + inp('todo', t.id, 'memo', t.memo, { extra: ' style="min-width:200px" aria-label="内容・進捗メモ"' }) + '</td>' +
              '<td>' + inp('todo', t.id, 'start', t.start, { cls: ' tab', extra: ' type="date" aria-label="開始日"' }) + '</td>' +
              '<td>' + inp('todo', t.id, 'end', t.end, { cls: ' tab', extra: ' type="date" aria-label="締切日"' }) + '</td>' +
              '<td style="text-align:right">' + leftPill(t.status, t.end) + '</td>' +
              '<td>' + inp('todo', t.id, 'who', t.who, { extra: ' style="min-width:110px" aria-label="担当者"' }) + '</td>' +
              '<td>' + inp('todo', t.id, 'fb', t.fb, { extra: ' style="min-width:150px" placeholder="—" aria-label="FBメモ"' }) + '</td>' +
              '<td>' + delBtn('todo', t.id) + '</td></tr>';
          }).join('');
      }).join('') + '</tbody></table></div>';
  }
  return page(head + '<p class="sub">担当者は「田中, 佐藤」のように名字をカンマ区切りで入力します。残日数は締切日から自動で計算します。表の見出しの境目をドラッグすると列の幅を変えられます（ダブルクリックで元に戻す）。</p>' + body);
}

/* ========== 集客アタック ========== */
function viewAttack(){
  var me = S.data.me, k = S.atkKind, ST = choices('アタックステータス');
  var all = P('atk').filter(function(a){ return a.kind === k; });
  var list = all.filter(function(a){ return (!S.filter.atk || a.status === S.filter.atk) && (!S.atkMine || a.who === me.name); });
  var est = 0, fix = 0; all.forEach(function(a){ est += Number(a.est)||0; fix += Number(a.fix)||0; });
  var head = '<div class="row spread"><div class="row">' +
    '<div class="seg" role="group" aria-label="種類"><button class="' + (k==='学生'?'on':'') + '" data-act="atkKind" data-v="学生">学生集客</button><button class="' + (k==='企業'?'on':'') + '" data-act="atkKind" data-v="企業">企業</button></div>' +
    '<div class="seg" role="group" aria-label="担当"><button class="' + (!S.atkMine?'on':'') + '" data-act="atkMine" data-v="0">全員</button><button class="' + (S.atkMine?'on':'') + '" data-act="atkMine" data-v="1">自分の担当</button></div></div>' +
    '<form class="row" data-form="atk"><label class="sr" for="atkName">相手の名前</label><input id="atkName" class="cell box" style="width:240px;max-width:100%" placeholder="' + (k==='学生' ? '例：F大学 キャリアセンター' : '例：K社') + '"><button class="btn pri" type="submit">＋ 追加</button></form></div>';
  var dup = !S.dup ? '' : '<div class="warnbox"><b>「' + esc(S.dup.name) + '」と同じ（または似た）アタック先がすでにあります</b><div class="list">' +
    S.dup.hits.map(function(h){ return '<div class="sub">・' + (h.same ? 'このプロジェクト' : esc(h.pjName)) + '：' + esc(h.name) + '（担当 ' + esc(h.who || '—') + '・' + esc(h.status) + '）</div>'; }).join('') +
    '</div><p class="sub" style="margin:0">重ねて連絡する前に、担当の人に相談しましょう。</p><div class="row"><button class="btn" data-act="dupCancel">追加をやめる</button><button class="btn pri" data-act="dupForce">それでも追加する</button></div></div>';
  var stats = '<div class="grid stats">' + statBtns('atk', ST, all, 'status', 'atk') +
    '<div class="stat gold"><span>確定 / 見込み</span><b class="tab">' + fix + '<small style="font-size:13px"> / ' + est + (k==='学生'?'名':'社') + '</small></b></div></div>' + filterNote('atk');

/* ========== アンケート分析 ========== */
var SKIP = /タイムスタンプ|メール|mail|氏名|名前|フリガナ|電話|学籍|ID|受付/i;
function analyze(ds){
  var out = []; if(!ds) return out;
  ds.headers.forEach(function(h, i){
    if(SKIP.test(h)) return;
    var vals = ds.rows.map(function(r){ return String(r[i] == null ? '' : r[i]).trim(); }).filter(Boolean);
    if(!vals.length) return;
    var nums = vals.map(Number);
    if(vals.every(function(v){ return /^\d+(\.\d+)?$/.test(v); }) && Math.max.apply(null, nums) <= 10){
      var mx = Math.max.apply(null, [5].concat(nums)), dist = {}; for(var k = 1; k <= mx; k++) dist[k] = 0;
      nums.forEach(function(n){ dist[Math.round(n)] = (dist[Math.round(n)]||0) + 1; });
      out.push({ h:h, i:i, kind:'rating', n:vals.length, avg: nums.reduce(function(a,b){ return a+b; }, 0)/nums.length, dist:dist }); return;
    }
    var multi = vals.filter(function(v){ return /,\s|、/.test(v); }).length / vals.length >= .25;
    var items = multi ? [].concat.apply([], vals.map(function(v){ return v.split(/,\s*|、/).map(function(x){ return x.trim(); }).filter(Boolean); })) : vals;
    var cnt = {}; items.forEach(function(v){ cnt[v] = (cnt[v]||0) + 1; });
    var avgLen = vals.reduce(function(a,v){ return a + v.length; }, 0) / vals.length;
    if(Object.keys(cnt).length <= 15 && avgLen < 14) out.push({ h:h, i:i, kind:'cat', n:vals.length, multi:multi, cnt:cnt });
    else if(avgLen >= 6) out.push({ h:h, i:i, kind:'text', n:vals.length });
  });
  return out;
}
function chart(a){
  var ent = a.kind === 'rating' ? Object.keys(a.dist).sort(function(x,y){ return y - x; }).map(function(k){ return [k, a.dist[k]]; }) : Object.keys(a.cnt).map(function(k){ return [k, a.cnt[k]]; }).sort(function(x,y){ return y[1] - x[1]; });
  var max = Math.max.apply(null, [1].concat(ent.map(function(e){ return e[1]; })));
  return '<div class="panel"><div class="row spread"><h3>' + esc(a.h) + '</h3>' + (a.kind === 'rating' ? '<span class="pill p-gold tab">平均 ' + a.avg.toFixed(2) + '</span>' : '<span class="sub">回答 ' + a.n + (a.multi ? '（複数回答）' : '') + '</span>') + '</div>' +
    ent.map(function(e){ return '<div class="hbar"><span>' + esc(e[0]) + '</span><span class="tr"><i style="width:' + (e[1]/max*100) + '%"></i></span><span class="n">' + e[1] + '（' + Math.round(e[1]/a.n*100) + '%）</span></div>'; }).join('') + '</div>';
}
var STOP = { 'こと':1,'もの':1,'ため':1,'よう':1,'感じ':1,'自分':1,'今回':1,'時間':1,'参加':1,'大学':1,'学生':1,'企業':1,'学年':1 };
function keywords(ds, ti, ri){
  var map = {};
  ds.rows.forEach(function(r){
    var t = String(r[ti] || ''); if(!t) return;
    var rate = ri >= 0 ? Number(r[ri]) : NaN, seen = {};
    (t.match(/[一-龯々]{2,}|[ァ-ヴー]{2,}|[A-Za-z]{2,}/g) || []).forEach(function(w){
      if(STOP[w] || seen[w]) return; seen[w] = 1;
      var m = map[w] || (map[w] = { w:w, n:0, sum:0, rn:0 }); m.n++; if(!isNaN(rate)){ m.sum += rate; m.rn++; }
    });
  });
  return Object.keys(map).map(function(k){ return map[k]; }).filter(function(m){ return m.n >= 2; }).sort(function(a,b){ return b.n - a.n; }).slice(0, 36).map(function(m){ m.avg = m.rn ? m.sum/m.rn : null; return m; });
}

    '<div class="grid stats">' + sts.map(function(s){ var n = all.filter(function(r){ return guestMatch(r, s); }).length, on = S.filter.guest === s; return '<button class="stat' + (on ? ' on' : '') + '" data-act="filt" data-k="guest" data-v="' + esc(s) + '"><span>' + esc(s) + '</span><b>' + n + '</b></button>'; }).join('') + '</div>' +
    filterNote('guest') +
    '<input id="q-guest" class="cell box" style="font-size:16px;padding:10px 12px" placeholder="名前・大学で探す" value="' + esc(S.search.guest || '') + '" data-search="guest" aria-label="検索">' +
    guestList(rows, 'guest') +
    '<form class="panel" data-form="guestNew"><h2>申込していない人が来たとき</h2><div class="grid g3"><input id="gnName" class="cell box" placeholder="氏名" aria-label="氏名"><input id="gnUniv" class="cell box" placeholder="大学" aria-label="大学"><input id="gnGrade" class="cell box" placeholder="学年" aria-label="学年"></div><button class="btn pri" type="submit" style="align-self:flex-start">当日参加として受付する</button></form>' +
    '</main><div class="foot">30秒ごとに自動で最新にします</div>';
}

/* ========== 表の列幅（見出しの境目をドラッグで変更・ブラウザごとに記憶） ========== */
var DRAG = null;
function loadColW(){ try { return JSON.parse(load('ypu_colw') || '{}') || {}; } catch(e){ return {}; } }
function heads(t){ return t.tHead ? t.tHead.rows[0].cells : []; }
function measure(t){ return Array.prototype.map.call(heads(t), function(th){ return Math.round(th.getBoundingClientRect().width); }); }
function fixW(t, w){
  var ths = heads(t), sum = 0;
  for(var i = 0; i < ths.length; i++){ ths[i].style.width = w[i] + 'px'; sum += w[i]; }
  t.style.width = sum + 'px'; t.classList.add('fixed');
}
function applyColW(){
  document.querySelectorAll('table[data-tbl]').forEach(function(t){
    var ths = heads(t), w = S.colW[t.getAttribute('data-tbl')];
    Array.prototype.forEach.call(ths, function(th, i){
      if(th.querySelector('.rz')) return;
      var h = document.createElement('span'); h.className = 'rz'; h.setAttribute('data-rz', i);
      h.title = 'ドラッグで幅を変える（ダブルクリックで元に戻す）'; th.appendChild(h);
    });
    if(w && w.length === ths.length) fixW(t, w);
  });
}
document.addEventListener('pointerdown', function(e){
  var h = e.target.closest && e.target.closest('.rz'); if(!h) return;
  e.preventDefault();
  var t = h.closest('table'), k = t.getAttribute('data-tbl'), saved = S.colW[k];
  var w = (saved && saved.length === heads(t).length) ? saved.slice() : measure(t);
  fixW(t, w);
  var i = Number(h.getAttribute('data-rz'));
  DRAG = { t:t, k:k, i:i, x:e.clientX, w0:w[i], w:w, h:h };
  h.classList.add('on'); document.body.classList.add('resizing');
});
document.addEventListener('pointermove', function(e){
  if(!DRAG) return;
  DRAG.w[DRAG.i] = Math.max(40, Math.round(DRAG.w0 + e.clientX - DRAG.x));
  fixW(DRAG.t, DRAG.w);
});
function endDrag(){
  if(!DRAG) return;
  S.colW[DRAG.k] = DRAG.w; store('ypu_colw', JSON.stringify(S.colW));
  DRAG.h.classList.remove('on'); document.body.classList.remove('resizing'); DRAG = null;
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('dblclick', function(e){
  var h = e.target.closest && e.target.closest('.rz'); if(!h) return;
  delete S.colW[h.closest('table').getAttribute('data-tbl')]; store('ypu_colw', JSON.stringify(S.colW)); render(); toast('列の幅を元に戻しました');
});

/* ========== 表示 ========== */
function render(){
  var root = document.getElementById('root'), html;
  if(GUEST) html = viewGuest();
  else if(S.view === 'login' || !S.token) html = viewLogin();
  else if(S.view === 'top') html = S.boot ? viewTop() : '';
  else if(!S.data) html = '';
  else html = ({ home:viewHome, todo:viewTodo, attack:viewAttack, members:viewMembers, equip:viewEquip, works:viewWorks, docs:viewDocs, timetable:viewTimetable, analysis:viewAnalysis, settings:viewSettings }[S.view] || viewHome)();
  if(!html) html = '<main class="content"><div class="empty">読み込んでいます…</div></main>';
  root.innerHTML = '<div class="app' + (isM() ? ' m' : '') + (S.busy && S.view !== 'login' ? ' loading' : '') + '">' + html + '</div>';
  applyColW();
  if(S.view === 'timetable' && S.sel && S.scrollSel){ var el = document.getElementById('blk-' + S.sel); if(el) el.scrollIntoView({ block:'nearest' }); S.scrollSel = false; }
}

/* ========== 保存 ========== */
function save(key, item, okMsg, force){
  S.busy = true;
  return call('saveRow', S.token, S.pjId, key, item, !!force).then(function(d){
    if(d && d.dup){ S.dup = { name:d.dup.name, hits:d.dup.hits, item:item }; S.busy = false; render(); return; }
    S.dup = null; merge(d); S.busy = false; render(); if(okMsg) toast(okMsg);
  }).catch(fail);
}
function guestSave(item, msg){
  S.busy = true;
  return call('guestSave', GUEST, item).then(function(g){ S.guest = g; S.busy = false; render(); if(msg) toast(msg); }).catch(function(e){ S.busy = false; toast((e && e.message) || 'エラーが起きました'); render(); });
}

/* ========== 操作 ========== */
var ACT = {
  go: function(v){ S.dup = null; if(v === 'top'){ S.pjId = ''; S.data = null; loadBoot(); } else loadView(v); },
  openPj: function(v){ openPj(v); },
  page: function(v){ loadView(PAGE_VIEW[v] || 'home'); },
  todoFilter: function(v){ S.todoStatus = v; S.todoMine = true; loadView('todo'); },
  todoMine: function(v){ S.todoMine = v === '1'; render(); },
  todoStatus: function(v){ S.todoStatus = v; render(); },
  layout: function(v){ S.layout = v; store('ypu_layout', v === 'auto' ? '' : v); render(); },
  filt: function(v, el){ var k = el.getAttribute('data-k'); S.filter[k] = S.filter[k] === v ? '' : v; render(); },
  cycle: function(v){
    var t = P('todo').filter(function(x){ return x.id === v; })[0]; if(!t) return;
    var next = {'未着手':'進行中','進行中':'完了','完了':'未着手'}[t.status] || '進行中';
    save('todo', { id:v, status:next }, '「' + (t.sub || t.group) + '」を' + next + 'にしました');
  },
  addRow: function(v){ S.todoStatus = '未完了'; save('todo', { group: v === '（大見出しなし）' ? '' : v, sub:'', start: todayStr(), end: addDays(7) }, '行を追加しました'); },
  delAsk: function(v, el){ var k = el.getAttribute('data-k') + v; S.confirmDel = k; render(); setTimeout(function(){ if(S.confirmDel === k){ S.confirmDel = ''; render(); } }, 4000); },
  del: function(v, el){ var key = el.getAttribute('data-k'); S.confirmDel = ''; S.busy = true; call('deleteRow', S.token, S.pjId, key, v).then(function(d){ merge(d); S.busy = false; render(); toast('削除しました'); }).catch(fail); },
  atkKind: function(v){ S.atkKind = v; S.filter.atk = ''; S.dup = null; render(); },
  atkMine: function(v){ S.atkMine = v === '1'; render(); },
  dupCancel: function(){ S.dup = null; render(); },
  dupForce: function(){ var it = S.dup.item; save('atk', it, '「' + it.name + '」を追加しました', true); },
  memTab: function(v){ S.memTab = v; render(); },
  recv: function(v, el){
    var mode = el.getAttribute('data-mode'), list = mode === 'guest' ? S.guest.guests : P('guest');
    var r = list.filter(function(x){ return x.id === v; })[0]; if(!r) return;
    var on = r.recv !== '済';
    if(mode === 'guest') guestSave({ id:v, recv:on, status: on ? '参加' : r.status }, on ? r.name + 'さんを受付しました' : '受付を取り消しました');
    else save('guest', on ? { id:v, recv:'済', status:'参加' } : { id:v, recv:'' }, on ? r.name + 'さんを受付しました' : '受付を取り消しました');
  },
  shareCreate: function(){ var d = (document.getElementById('shareDays') || {}).value || 7; S.busy = true; render(); call('shareCreate', S.token, S.pjId, d).then(function(x){ merge(x); S.busy = false; render(); toast('受付リンクを発行しました'); }).catch(fail); },
  shareStop: function(){ S.busy = true; render(); call('shareStop', S.token, S.pjId).then(function(x){ merge(x); S.busy = false; render(); toast('受付リンクを止めました'); }).catch(fail); },
  copyLink: function(){ var el = document.getElementById('shareLink'); if(!el) return; el.select(); var done = function(){ toast('リンクをコピーしました'); }; if(navigator.clipboard) navigator.clipboard.writeText(el.value).then(done, function(){ try { document.execCommand('copy'); done(); } catch(e){ toast('コピーできませんでした。リンクを長押しまたは選択してコピーしてください'); } }); else { try { document.execCommand('copy'); done(); } catch(e){} } },
  import: function(v){ S.busy = true; render(); call('importForm', S.token, S.pjId, v).then(function(x){ merge(x); S.busy = false; render(); toast(x.imported ? x.imported + '件を取り込みました' : '新しい回答はありませんでした'); }).catch(fail); },
  addStaff: function(){ save('staff', { name:'' }, '1行追加しました'); },
  equipMode: function(v){ S.equipMode = v; render(); },
  addEquip: function(){ S.equipMode = 'prep'; S.filter.equip = ''; save('equip', { name:'' }, '1行追加しました'); },
  eqCheck: function(v, el){
    var k = el.getAttribute('data-k'), e = P('equip').filter(function(x){ return x.id === v; })[0]; if(!e) return;
    var item = { id:v }; item[k] = !e[k];
    if(k === 'inC' && !e.inC && ['確保済','手配済'].indexOf(e.status) >= 0) item.status = '搬入済';
    save('equip', item, (k === 'inC' ? '搬入' : '搬出') + (item[k] ? 'にしました' : 'を取り消しました'));
  },
  addWork: function(){ S.filter.work = ''; save('work', { name:'', due: addDays(14) }, '1行追加しました'); },
  addDoc: function(){ S.filter.doc = ''; save('doc', { name:'新しい資料' }, '資料の枠を追加しました'); },
  ttTab: function(v){ S.ttTab = v; render(); },
  ttSave: function(){ var c = S.ttDraft; if(!c) return; S.busy = true; render(); call('saveTTConfig', S.token, S.pjId, c, c.cols).then(function(d){ S.ttDraft = null; merge(d); S.busy = false; render(); toast('見た目と列を保存しました'); }).catch(fail); },
  ttAddCol: function(){ var c = draft(); c.cols.push({ name:'新しい列', group:'参加者', w:80 }); render(); },
  ttDelCol: function(v){ var c = draft(); if(c.cols.length <= 1) return; c.cols.splice(Number(v), 1); render(); },
  addBlock: function(){ var c = ttCfg(); save('block', { s:'12:00', e:'12:30', c1: (c.cols[0] && c.cols[0].order) || 1, c2: (c.cols[0] && c.cols[0].order) || 1, text:'新しい枠', st:'薄イエロー' }, '枠を追加しました'); },
  addFlow: function(){ var rows = flowRows(), last = rows[rows.length - 1]; save('flow', { s: last ? last.e : ttCfg().start, item:'' }, '行を追加しました'); },
  exportPptx: function(){ exportPptx(); },
  exportHtml: function(){ exportHtml(); },
  reloadForms: function(){ loadForms(); },
  kw: function(v){ S.kw = v || ''; render(); },
  rmMember: function(v){ adm('removePjMember', v); },
  saveGroup: function(v){
    var tr = document.querySelector('tr[data-grow="' + v + '"]'); if(!tr) return;
    var pages = {}; tr.querySelectorAll('[data-gp]').forEach(function(c){ pages[c.getAttribute('data-gp')] = c.checked; });
    adm('saveGroup', { oldName: tr.getAttribute('data-old'), name: tr.querySelector('[data-g="name"]').value, emails: tr.querySelector('[data-g="emails"]').value, pages: pages });
  },
  delGroup: function(v){ if(S.confirmDel !== 'grp' + v){ S.confirmDel = 'grp' + v; toast('もう一度押すと「' + v + '」を削除します'); setTimeout(function(){ if(S.confirmDel === 'grp' + v) S.confirmDel = ''; }, 4000); return; } S.confirmDel = ''; adm('deleteGroup', v); },
  autoImport: function(v){ adm('setAutoImport', v === '1'); },
  backEmail: function(){ S.step = 'email'; S.msg = ''; render(); },
  logout: function(){ call('logout', S.token).catch(function(){}); store('ypu_token', ''); S.token = ''; S.view = 'login'; S.step = 'email'; S.msg = 'ログアウトしました。'; S.msgOk = true; S.boot = null; S.data = null; render(); }
};
function draft(){ if(!S.ttDraft) S.ttDraft = JSON.parse(JSON.stringify(ttCfg())); return S.ttDraft; }
function refreshPreview(){ var p = document.getElementById('ttPreview'); if(p) p.innerHTML = ttHTML(ttCfg(), P('block'), S.sel); var b = document.querySelector('[data-act="ttSave"]'); if(b && S.ttDraft){ b.disabled = false; b.textContent = '保存する'; b.classList.add('pri'); } }

document.addEventListener('click', function(e){
  var blk = e.target.closest('[data-blk]');
  if(blk){ S.sel = blk.getAttribute('data-blk'); S.scrollSel = true; render(); return; }
  var el = e.target.closest('[data-act]'); if(!el) return;
  if(S.busy && el.getAttribute('data-act') !== 'logout') return;
  var fn = ACT[el.getAttribute('data-act')]; if(fn){ e.preventDefault(); fn(el.getAttribute('data-v'), el); }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.hasAttribute('data-cfg')){ var c = draft(), k = el.getAttribute('data-cfg'); c[k] = /hourH|font/.test(k) ? Number(el.value) || c[k] : el.value; refreshPreview(); return; }
  if(el.hasAttribute('data-col')){ var c2 = draft(), col = c2.cols[Number(el.getAttribute('data-col'))], f = el.getAttribute('data-cf'); if(col){ col[f] = f === 'w' ? Number(el.value) || 80 : el.value; if(f !== 'w' || el.value) refreshPreview(); } return; }
  if(el.hasAttribute('data-search')){ var sk = el.getAttribute('data-search'), pos = el.selectionStart; S.search[sk] = el.value; render(); var n = document.getElementById('q-' + sk); if(n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(err){} } }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if(el.getAttribute('data-local') === 'flowAt'){ S.flowAt = el.value; render(); return; }
  if(el.hasAttribute('data-gs')){
    var mode = el.getAttribute('data-gs'), gid = el.getAttribute('data-id');
    if(mode === 'guest') guestSave({ id:gid, status:el.value }, '保存しました'); else save('guest', { id:gid, status:el.value }, '保存しました');
    return;
  }
  var urow = el.closest('[data-urow]');
  if(urow && el.hasAttribute('data-u')){
    var u = { email: urow.getAttribute('data-urow') }; urow.querySelectorAll('[data-u]').forEach(function(x){ u[x.getAttribute('data-u')] = x.value; });
    adm('saveUser', u); return;
  }
  if(!el.hasAttribute('data-t') || !el.hasAttribute('data-f')) return;
  var key = el.getAttribute('data-t'), f = el.getAttribute('data-f'), item = { id: el.getAttribute('data-id') };
  item[f] = el.type === 'checkbox' ? el.checked : el.value;
  if(key === 'atk' && f === 'status' && el.value !== '未連絡') item.last = todayStr();
  if(key === 'block') S.sel = item.id;
  save(key, item, '保存しました');
});
document.addEventListener('submit', function(e){
  var f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  var kind = f.getAttribute('data-form'), val = function(id){ var x = document.getElementById(id); return x ? x.value.trim() : ''; };
  var fd = {}; Array.prototype.forEach.call(f.elements, function(x){ if(x.name) fd[x.name] = x.value; });
  if(kind === 'email'){
    S.email = val('email'); store('ypu_email', S.email); S.busy = true; S.msg = ''; render();
    call('requestCode', S.email).then(function(r){ S.busy = false; if(r.ok){ S.step = 'code'; S.msg = 'コードを送りました。'; S.msgOk = true; } else { S.msg = r.msg; S.msgOk = false; } render(); var c = document.getElementById('code'); if(c) c.focus(); })
      .catch(function(err){ S.busy = false; S.msg = (err && err.message) || 'エラーが起きました'; S.msgOk = false; render(); });
  } else if(kind === 'code'){
    var code = val('code'); S.busy = true; S.msg = ''; render();
    call('verifyCode', S.email, code).then(function(r){ S.busy = false; if(r.ok){ S.token = r.token; store('ypu_token', r.token); S.msg = ''; loadBoot(); } else { S.msg = r.msg; S.msgOk = false; render(); } })
      .catch(function(err){ S.busy = false; S.msg = (err && err.message) || 'エラーが起きました'; S.msgOk = false; render(); });
  } else if(kind === 'group'){
    var name = val('newGroup'); if(!name) return; S.todoStatus = '未完了';
    save('todo', { group:name, sub:'', start: todayStr(), end: addDays(7) }, '「' + name + '」を追加しました');
  } else if(kind === 'atk'){
    var nm = val('atkName'); if(!nm) return; S.filter.atk = '';
    save('atk', { name:nm, kind:S.atkKind, nextDate: addDays(2) }, '「' + nm + '」を追加しました');
  } else if(kind === 'guestAdd'){
    var gn = val('gName'); if(!gn) return toast('氏名を入力してください');
    save('guest', { name:gn, univ:val('gUniv'), grade:val('gGrade'), status:'参加', recv:'済', src:'当日追加' }, gn + 'さんを当日参加で受付しました');
  } else if(kind === 'guestNew'){
    var gn2 = val('gnName'); if(!gn2) return toast('氏名を入力してください');
    guestSave({ name:gn2, univ:val('gnUniv'), grade:val('gnGrade') }, gn2 + 'さんを当日参加で受付しました');
  } else if(kind === 'pjinfo'){ adm('saveProjectInfo', fd); }
  else if(kind === 'member'){ if(!fd.email) return toast('追加する人を選んでください'); adm('savePjMember', fd.email, fd.role); }
  else if(kind === 'user'){ adm('saveUser', { email:fd.email, last:fd.last, first:fd.first, kind:fd.kind, active:'有効' }); }
  else if(kind === 'tools'){ adm('saveTools', { design:{ name:fd.design_name, url:fd.design_url }, submit:{ name:fd.submit_name, url:fd.submit_url }, drawing:{ name:fd.drawing_name, url:fd.drawing_url } }); }
  else if(kind === 'newpj'){
    S.busy = true; render();
    call('createProject', S.token, S.pjId, fd).then(function(r){ S.busy = false; toast('プロジェクトを作成しました'); openPj(r.newId); }).catch(fail);
  }
});

if(!API){

  return;
}

  call('guestGet', GUEST).then(function(g){ S.guest = g; render(); }).catch(function(e){ S.guestErr = (e && e.message) || 'このリンクは使えません。'; render(); });
} else if(S.token){ S.view = 'top'; render(); loadBoot(); }
else render();
})();
